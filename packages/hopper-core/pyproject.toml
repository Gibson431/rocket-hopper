[project]
name = "hopper-core"
version = "0.1.0"
description = "Shared types and quaternion math for the hopper flight software"
authors = [
    { name = "Gibson431", email = "timmaxgibson@gmail.com" }
]
requires-python = ">=3.12"
dependencies = ["numpy>=2.5.4"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"


[dependency-groups]
dev = ["hypothesis>=6.170.1", "pytest>=9.1.1"]
